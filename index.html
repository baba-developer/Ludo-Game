<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutix Blast - Mobile Optimized</title>
    <style>
        body { 
            margin: 0; background: #1a1a2e; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; touch-action: none; color: white;
        }

        /* Name Screen */
        #name-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #4e31aa; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 30000;
        }
        .name-input {
            padding: 15px; border-radius: 10px; border: 3px solid #e94560; 
            width: 250px; font-size: 18px; text-align: center; margin-bottom: 20px;
            outline: none; background: #1a1a2e; color: white;
        }

        #splash, #ad-screen, #settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #4e31aa; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }
        
        #ad-screen, #settings-overlay { background: rgba(0,0,0,0.95); display: none; z-index: 20000; }

        .loader-circle {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 1s ease-in-out infinite; margin-top: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #main-menu, #level-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e; display: none; flex-direction: column;
            align-items: center; z-index: 8000; padding: 40px 0; box-sizing: border-box;
        }

        .menu-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .dev-footer {
            font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            font-weight: bold; margin-top: 20px; text-align: center;
        }

        .map-container {
            width: 100%; height: 70vh; overflow-y: auto; 
            padding: 40px 0; scrollbar-width: none;
        }
        .map-container::-webkit-scrollbar { display: none; }

        .level-path { display: flex; flex-direction: column-reverse; align-items: center; }

        .level-node {
            width: 60px; height: 60px; margin: 20px 0;
            background: #e94560; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
            cursor: pointer; transition: 0.2s;
        }
        .level-node.locked { background: #444; border-color: #666; opacity: 0.6; }

        .btn { 
            width: 200px; padding: 15px; margin: 10px; border: none; border-radius: 50px; 
            background: #e94560; color: white; font-size: 16px; font-weight: bold; 
            box-shadow: 0 4px #950101; cursor: pointer; text-transform: uppercase;
        }

        #game-ui { display: none; text-align: center; width: 100%; max-width: 500px; }
        
        .progress-container {
            width: 90%; height: 18px; background: #333; 
            margin: 10px auto; border-radius: 10px; position: relative; border: 2px solid #fff;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%; height: 100%; background: linear-gradient(to right, #f9d342, #ffae00);
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .star { font-size: 18px; filter: grayscale(1); margin: 0 5px; transition: 0.3s; }
        .star.active { filter: grayscale(0); transform: scale(1.3); }

        .info-panel { 
            background: #0f3460; padding: 10px; border-radius: 15px; 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; 
            margin: 10px; border: 1px solid #e94560; font-size: 14px;
        }

        /* GRID FIX FOR MOBILE */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); /* Har column barabar hoga */
            gap: 4px; 
            background: rgba(255,255,255,0.05); 
            padding: 8px; 
            border-radius: 12px; 
            margin: 0 auto;
            width: 92vw; /* Screen width ke mutabiq */
            max-width: 400px; /* Tablet/Desktop par zyada bada na ho */
            box-sizing: border-box;
            touch-action: none;
        }
        .candy { 
            aspect-ratio: 1 / 1; /* Hamesha square rahega */
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 6vw; /* Fruit size screen ke hisab se */
            background: rgba(255,255,255,0.1); 
            transition: transform 0.15s ease-out;
            user-select: none;
        }
        @media(min-width: 450px) { .candy { font-size: 28px; } }

        .rewards-footer { display: flex; gap: 8px; justify-content: center; margin-top: 15px; width: 100%; }
        .reward-btn {
            background: #28a745; color: white; border: none; padding: 8px 10px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
            box-shadow: 0 3px #1e7e34; flex: 1; max-width: 140px;
        }

        @keyframes hint-glow {
            0%, 100% { transform: scale(1); background: rgba(255,255,255,0.1); }
            50% { transform: scale(1.1); background: #f9d342; box-shadow: 0 0 15px #f9d342; }
        }
        .hint-active { animation: hint-glow 0.6s infinite; z-index: 100; }
    </style>
</head>
<body onclick="initAudio()">

    <div id="name-screen">
        <h2 style="margin-bottom: 20px;">WELCOME TO FRUTIX</h2>
        <input type="text" id="playerNameInput" class="name-input" placeholder="Enter Your Name" maxlength="12">
        <button class="btn" onclick="savePlayerName()">START GAME</button>
        <p class="dev-footer">BABA-DEVELOPER</p>
    </div>

    <div id="settings-overlay">
        <h2>SETTINGS</h2>
        <button class="btn" onclick="toggleMusic()" id="music-btn">MUSIC: ON</button>
        <button class="btn" onclick="resetGame()" style="background:#555;">RESET PROGRESS</button>
        <button class="btn" onclick="closeSettings()">CLOSE</button>
    </div>

    <div id="ad-screen">
        <h3>REWARD LOADING...</h3>
        <div class="loader-circle"></div>
    </div>

    <div id="splash">
        <h1 id="splash-name">Frutix Blast</h1>
        <div class="loader-circle"></div>
        <p class="dev-footer">POWERED BY BABA-DEVELOPER</p>
    </div>

    <div id="main-menu">
        <div class="menu-content">
            <h3 id="welcome-text" style="color: #f9d342; margin: 0;">Hi, Player!</h3>
            <h1 style="color: #e94560; font-size: 48px; margin: 0;">FRUTIX</h1>
            <p style="margin-bottom: 30px;">Premium Blast Game</p>
            <button class="btn" onclick="showLevelMenu()">NEW GAME</button>
            <button class="btn" onclick="openSettings()" style="background:#4e31aa;">SETTINGS</button>
            <button class="btn" onclick="showLevelMenu()">LEVELS</button>
        </div>
        <div class="dev-footer">POWERED BY BABA-DEVELOPER</div>
    </div>

    <div id="level-menu">
        <h2>SELECT LEVEL</h2>
        <div class="map-container">
            <div class="level-path" id="levelContainer"></div>
        </div>
        <button class="btn" style="background:#555;" onclick="hideLevelMenu()">BACK</button>
        <div class="dev-footer">POWERED BY BABA-DEVELOPER</div>
    </div>

    <div id="game-ui">
        <div style="display: flex; justify-content: space-between; align-items:center; padding: 10px; width: 95%;">
            <button onclick="backToMenu()" style="background:#444; color:white; border:none; padding:8px 12px; border-radius:5px; font-size:12px;">EXIT</button>
            <span id="player-display" style="color:#f9d342; font-weight:bold; font-size:14px;">Player</span>
            <b id="lvlShow" style="font-size: 18px;">Lvl 1</b>
        </div>

        <div class="progress-container"><div id="progress-fill"></div></div>
        <div style="display:flex; justify-content: center; margin-bottom: 5px;">
            <span class="star" id="star1">⭐</span><span class="star" id="star2">⭐</span><span class="star" id="star3">⭐</span>
        </div>

        <div class="info-panel">
            <div>TARGET: <b id="targetShow">🍎 x 20</b></div>
            <div style="color: #f9d342;">MOVES: <b id="movesShow">30</b></div>
        </div>

        <div id="grid"></div>

        <div class="rewards-footer">
            <button class="reward-btn" onclick="watchAd('hint')">💡 HINT (AD)</button>
            <button class="reward-btn" onclick="watchAd('moves')" style="background:#f39c12; box-shadow: 0 3px #d68910;">➕ 5 MOVES (AD)</button>
        </div>
    </div>

    <script>
        const candyTypes = ['🍎', '🍇', '🍊', '🫐', '🍋'];
        let unlockedLevel = parseInt(localStorage.getItem('fb_unlocked')) || 1;
        let playerName = localStorage.getItem('fb_playername') || "";
        let musicOn = true, currentLvl = 1, moves = 30, targetFruit = '', targetCount = 20, initialTarget = 20, candies = [];
        let isGameActive = false, audioInited = false;
        let startX, startY, activeCandyIdx = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        window.onload = () => {
            if (playerName !== "") {
                document.getElementById('name-screen').style.display = 'none';
                startSplash();
            }
        };

        function savePlayerName() {
            const input = document.getElementById('playerNameInput').value.trim();
            if (input === "") { alert("Please enter your name!"); return; }
            playerName = input;
            localStorage.setItem('fb_playername', playerName);
            document.getElementById('name-screen').style.display = 'none';
            startSplash();
        }

        function startSplash() {
            document.getElementById('splash').style.display = 'flex';
            document.getElementById('welcome-text').innerText = "Hi, " + playerName + "!";
            document.getElementById('player-display').innerText = playerName;
            setTimeout(() => { 
                document.getElementById('splash').style.display = 'none'; 
                document.getElementById('main-menu').style.display = 'flex'; 
            }, 1500);
        }

        function initAudio() { if(!audioInited) { audioInited = true; playBGM(); } }
        function playBGM() {
            setInterval(() => {
                if(!musicOn || !isGameActive) return;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(261.6, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.005, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }, 3000);
        }

        function openSettings() { document.getElementById('settings-overlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-overlay').style.display = 'none'; }
        function toggleMusic() { musicOn = !musicOn; document.getElementById('music-btn').innerText = `MUSIC: ${musicOn ? 'ON' : 'OFF'}`; }
        function resetGame() { if(confirm("Reset progress?")) { localStorage.clear(); location.reload(); } }

        function watchAd(type) {
            if(!isGameActive) return; isGameActive = false;
            document.getElementById('ad-screen').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('ad-screen').style.display = 'none'; isGameActive = true;
                if(type === 'hint') findHint();
                if(type === 'moves') { moves += 5; document.getElementById('movesShow').innerText = moves; }
            }, 2000);
        }

        function startLevel(lvl) {
            currentLvl = lvl; targetFruit = candyTypes[Math.floor(Math.random() * candyTypes.length)];
            targetCount = 15 + (lvl * 5); initialTarget = targetCount; moves = 30;
            isGameActive = true;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('level-menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('lvlShow').innerText = "Lvl " + lvl;
            document.getElementById('movesShow').innerText = moves;
            resetStars(); updateUI(); initGrid();
        }

        function resetStars() {
            document.getElementById('star1').classList.remove('active');
            document.getElementById('star2').classList.remove('active');
            document.getElementById('star3').classList.remove('active');
        }

        function initGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = ''; candies = [];
            for(let i=0; i<64; i++) {
                const c = document.createElement('div'); c.className = 'candy'; c.id = i;
                let fruit; do { fruit = candyTypes[Math.floor(Math.random()*candyTypes.length)]; } while (willMatch(i, fruit));
                c.innerHTML = fruit; grid.appendChild(c); candies.push(c);
            }
            setupSmoothTouch();
        }

        function willMatch(i, fruit) {
            if (i % 8 >= 2 && candies[i-1].innerHTML === fruit && candies[i-2].innerHTML === fruit) return true;
            if (i >= 16 && candies[i-8].innerHTML === fruit && candies[i-16].innerHTML === fruit) return true;
            return false;
        }

        function setupSmoothTouch() {
            const grid = document.getElementById('grid');
            grid.addEventListener('pointerdown', e => {
                if(!isGameActive || !e.target.classList.contains('candy')) return;
                activeCandyIdx = parseInt(e.target.id);
                startX = e.clientX; startY = e.clientY;
            });
            grid.addEventListener('pointermove', e => {
                if (activeCandyIdx === null) return;
                const diffX = e.clientX - startX; const diffY = e.clientY - startY;
                const threshold = 25;
                if (Math.abs(diffX) > threshold || Math.abs(diffY) > threshold) {
                    let targetIdx = activeCandyIdx;
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        targetIdx += (diffX > 0) ? 1 : -1;
                        if (Math.floor(targetIdx/8) !== Math.floor(activeCandyIdx/8)) targetIdx = activeCandyIdx;
                    } else {
                        targetIdx += (diffY > 0) ? 8 : -8;
                    }
                    if (targetIdx >= 0 && targetIdx < 64 && targetIdx !== activeCandyIdx) {
                        swap(activeCandyIdx, targetIdx); activeCandyIdx = null;
                    }
                }
            });
            window.addEventListener('pointerup', () => activeCandyIdx = null);
        }

        function swap(id1, id2) {
            let v1 = candies[id1].innerHTML, v2 = candies[id2].innerHTML;
            candies[id1].style.transform = "scale(0.8)"; candies[id2].style.transform = "scale(0.8)";
            setTimeout(() => {
                candies[id1].innerHTML = v2; candies[id2].innerHTML = v1;
                candies[id1].style.transform = "scale(1)"; candies[id2].style.transform = "scale(1)";
                if (processMatches()) { moves--; document.getElementById('movesShow').innerText = moves; } 
                else { setTimeout(() => { candies[id1].innerHTML = v1; candies[id2].innerHTML = v2; }, 200); }
            }, 100);
        }

        function processMatches() {
            let found = false, toClear = new Set();
            for(let i=0; i<64; i++) {
                if(i%8<6 && candies[i].innerHTML !== '' && candies[i].innerHTML === candies[i+1].innerHTML && candies[i].innerHTML === candies[i+2].innerHTML) {
                    toClear.add(i); toClear.add(i+1); toClear.add(i+2); found = true;
                }
                if(i<48 && candies[i].innerHTML !== '' && candies[i].innerHTML === candies[i+8].innerHTML && candies[i].innerHTML === candies[i+16].innerHTML) {
                    toClear.add(i); toClear.add(i+8); toClear.add(i+16); found = true;
                }
            }
            toClear.forEach(idx => {
                if(candies[idx].innerHTML === targetFruit && targetCount > 0) { targetCount--; updateUI(); }
                candies[idx].innerHTML = '';
            });
            return found;
        }

        setInterval(() => {
            if(!isGameActive) return;
            processMatches();
            for(let i=55; i>=0; i--) {
                if(candies[i].innerHTML !== '' && candies[i+8].innerHTML === '') {
                    candies[i+8].innerHTML = candies[i].innerHTML; candies[i].innerHTML = '';
                }
            }
            for(let i=0; i<64; i++) if(candies[i].innerHTML === '') candies[i].innerHTML = candyTypes[Math.floor(Math.random()*candyTypes.length)];
            
            if(targetCount <= 0) {
                if(currentLvl == unlockedLevel) { unlockedLevel++; localStorage.setItem('fb_unlocked', unlockedLevel); }
                isGameActive = false; alert("LEVEL WON!"); backToMenu();
            } else if(moves <= 0) { isGameActive = false; alert("GAME OVER!"); backToMenu(); }
        }, 250);

        function updateUI() {
            document.getElementById('targetShow').innerText = `${targetFruit} x ${targetCount}`;
            let percent = ((initialTarget - targetCount) / initialTarget) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            if(percent >= 33) document.getElementById('star1').classList.add('active');
            if(percent >= 66) document.getElementById('star2').classList.add('active');
            if(percent >= 100) document.getElementById('star3').classList.add('active');
        }

        function findHint() {
            for(let i=0; i<64; i++) {
                let neighbors = [i+1, i+8, i-1, i-8];
                for(let n of neighbors) {
                    if(n >= 0 && n < 64 && checkValid(i, n)) {
                        candies[i].classList.add('hint-active');
                        candies[n].classList.add('hint-active');
                        setTimeout(() => { candies[i].classList.remove('hint-active'); candies[n].classList.remove('hint-active'); }, 2500);
                        return;
                    }
                }
            }
        }

        function checkValid(id1, id2) {
            let v1 = candies[id1].innerHTML, v2 = candies[id2].innerHTML;
            candies[id1].innerHTML = v2; candies[id2].innerHTML = v1;
            let m = false;
            for(let i=0; i<64; i++) {
                if(i%8<6 && candies[i].innerHTML!='' && candies[i].innerHTML===candies[i+1].innerHTML && candies[i].innerHTML===candies[i+2].innerHTML) m=true;
                if(i<48 && candies[i].innerHTML!='' && candies[i].innerHTML===candies[i+8].innerHTML && candies[i].innerHTML===candies[i+16].innerHTML) m=true;
            }
            candies[id1].innerHTML = v1; candies[id2].innerHTML = v2;
            return m;
        }

        function showLevelMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('level-menu').style.display = 'flex';
            const container = document.getElementById('levelContainer'); container.innerHTML = '';
            for(let i=1; i<=20; i++) {
                const b = document.createElement('div'); b.innerText = i;
                b.className = 'level-node' + (i > unlockedLevel ? ' locked' : '');
                if(i <= unlockedLevel) b.onclick = () => startLevel(i);
                container.appendChild(b);
            }
        }
        function hideLevelMenu() { document.getElementById('level-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }
        function backToMenu() { isGameActive = false; document.getElementById('game-ui').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }
    </script>
</body>
</html>
