<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutix Blast - Baba Developer Edition</title>
    <style>
        body { 
            margin: 0; background: #1a1a2e; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; touch-action: none; color: white;
        }

        #splash, #ad-screen, #settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #4e31aa; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }
        
        #ad-screen, #settings-overlay { background: rgba(0,0,0,0.95); display: none; z-index: 20000; }

        .loader-circle {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 1s ease-in-out infinite; margin-top: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #main-menu, #level-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e; display: none; flex-direction: column;
            align-items: center; z-index: 8000; padding: 40px 0; box-sizing: border-box;
        }

        .menu-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .dev-footer {
            font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            font-weight: bold; margin-top: 20px;
        }

        .map-container {
            width: 100%; height: 70vh; overflow-y: auto; 
            padding: 40px 0; scrollbar-width: none;
        }
        .map-container::-webkit-scrollbar { display: none; }

        .level-path { display: flex; flex-direction: column-reverse; align-items: center; }

        .level-node {
            width: 60px; height: 60px; margin: 20px 0;
            background: #e94560; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
            cursor: pointer; transition: 0.2s;
        }
        .level-node.locked { background: #444; border-color: #666; opacity: 0.6; }

        .btn { 
            width: 200px; padding: 15px; margin: 10px; border: none; border-radius: 50px; 
            background: #e94560; color: white; font-size: 16px; font-weight: bold; 
            box-shadow: 0 4px #950101; cursor: pointer; text-transform: uppercase;
        }

        #game-ui { display: none; text-align: center; width: 100%; max-width: 360px; }
        
        .progress-container {
            width: 90%; height: 18px; background: #333; 
            margin: 10px auto; border-radius: 10px; position: relative; border: 2px solid #fff;
        }
        #progress-fill {
            width: 0%; height: 100%; background: linear-gradient(to right, #f9d342, #ffae00);
            border-radius: 8px; transition: width 0.3s;
        }
        .star { font-size: 18px; filter: grayscale(1); margin: 0 10px; }
        .star.active { filter: grayscale(0); transform: scale(1.2); }

        .info-panel { 
            background: #0f3460; padding: 10px; border-radius: 15px; 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; 
            margin: 10px; border: 1px solid #e94560;
        }

        #grid { 
            display: grid; grid-template-columns: repeat(8, 40px); gap: 4px; 
            background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; margin: auto; 
        }
        .candy { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #fff; color: initial;}

        .rewards-footer { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .reward-btn {
            background: #28a745; color: white; border: none; padding: 10px 12px;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px;
            box-shadow: 0 3px #1e7e34;
        }

        @keyframes hint-glow {
            0% { background: #fff; transform: scale(1); }
            50% { background: #f9d342; transform: scale(1.15); box-shadow: 0 0 15px #f9d342; }
            100% { background: #fff; transform: scale(1); }
        }
        .hint-active { animation: hint-glow 0.6s infinite; z-index: 100; }
    </style>
</head>
<body onclick="initAudio()">

    <div id="settings-overlay">
        <h2>SETTINGS</h2>
        <button class="btn" onclick="toggleMusic()" id="music-btn">MUSIC: ON</button>
        <button class="btn" onclick="resetGame()" style="background:#555;">RESET ALL LEVELS</button>
        <button class="btn" onclick="closeSettings()">CLOSE</button>
    </div>

    <div id="ad-screen">
        <h3>REWARD AD LOADING...</h3>
        <div class="loader-circle"></div>
        <p>Please wait 2 seconds</p>
    </div>

    <div id="splash">
        <h1>Frutix Blast</h1>
        <div class="loader-circle"></div>
        <p class="dev-footer">POWERED BY BABA-DEVELOPER</p>
    </div>

    <div id="main-menu">
        <div class="menu-content">
            <h1 style="color: #e94560; font-size: 48px; margin: 0;">FRUTIX</h1>
            <p style="margin-bottom: 30px;">Premium Blast Game</p>
            <button class="btn" onclick="showLevelMenu()">NEW GAME</button>
            <button class="btn" onclick="openSettings()" style="background:#4e31aa;">SETTINGS</button>
            <button class="btn" onclick="showLevelMenu()">LEVELS</button>
        </div>
        <div class="dev-footer">POWERED BY BABA-DEVELOPER</div>
    </div>

    <div id="level-menu">
        <h2>SELECT LEVEL</h2>
        <div class="map-container">
            <div class="level-path" id="levelContainer"></div>
        </div>
        <button class="btn" style="background:#555;" onclick="hideLevelMenu()">BACK</button>
        <div class="dev-footer">POWERED BY BABA-DEVELOPER</div>
    </div>

    <div id="game-ui">
        <div style="display: flex; justify-content: space-between; padding: 10px; width: 95%;">
            <button onclick="backToMenu()" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:5px;">EXIT</button>
            <b id="lvlShow" style="font-size: 20px;">Lvl 1</b>
        </div>

        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
        <div style="display:flex; justify-content: center; margin-bottom: 10px;">
            <span class="star" id="star1">⭐</span>
            <span class="star" id="star2">⭐</span>
            <span class="star" id="star3">⭐</span>
        </div>

        <div class="info-panel">
            <div>TARGET: <b id="targetShow">🍎 x 20</b></div>
            <div>LEFT: <b id="leftShow">20</b></div>
            <div style="color: #f9d342;">MOVES: <b id="movesShow">30</b></div>
        </div>

        <div id="grid"></div>

        <div class="rewards-footer">
            <button class="reward-btn" onclick="watchAd('hint')">💡 HINT (AD)</button>
            <button class="reward-btn" onclick="watchAd('moves')" style="background:#f39c12; box-shadow: 0 3px #d68910;">➕ 5 MOVES (AD)</button>
        </div>
    </div>

    <script>
        const candyTypes = ['🍎', '🍇', '🍊', '🫐', '🍋'];
        let unlockedLevel = parseInt(localStorage.getItem('fb_unlocked')) || 1;
        let musicOn = true;
        let currentLvl = 1, moves = 30, targetFruit = '', targetCount = 20, initialTarget = 20, candies = [];
        let isGameActive = false, audioInited = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function initAudio() {
            if(audioInited) return;
            audioInited = true;
            playBGM();
        }

        function playBGM() {
            setInterval(() => {
                if(!musicOn || !isGameActive && document.getElementById('main-menu').style.display !== 'flex') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(261.6, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            }, 2500);
        }

        function playMatchSound() {
            if(!musicOn) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(523.2, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        window.onload = () => {
            setTimeout(() => { 
                document.getElementById('splash').style.display = 'none'; 
                document.getElementById('main-menu').style.display = 'flex'; 
            }, 2000);
        };

        // UI Controls
        function openSettings() { document.getElementById('settings-overlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-overlay').style.display = 'none'; }
        function toggleMusic() {
            musicOn = !musicOn;
            document.getElementById('music-btn').innerText = `MUSIC: ${musicOn ? 'ON' : 'OFF'}`;
        }
        function resetGame() {
            if(confirm("Dabba Developer: Reset all progress?")) {
                localStorage.setItem('fb_unlocked', 1);
                location.reload();
            }
        }

        // Ad Rewards
        function watchAd(type) {
            if(!isGameActive) return;
            isGameActive = false;
            document.getElementById('ad-screen').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('ad-screen').style.display = 'none';
                isGameActive = true;
                if(type === 'hint') findHint();
                if(type === 'moves') { moves += 5; document.getElementById('movesShow').innerText = moves; }
            }, 2000);
        }

        function findHint() {
            for(let i=0; i<64; i++) {
                let checks = [i+1, i+8];
                for(let next of checks) {
                    if(next < 64 && isValid(i, next)) {
                        candies[i].classList.add('hint-active');
                        candies[next].classList.add('hint-active');
                        setTimeout(() => {
                            candies[i].classList.remove('hint-active');
                            candies[next].classList.remove('hint-active');
                        }, 3000);
                        return;
                    }
                }
            }
        }

        function isValid(id1, id2) {
            let v1 = candies[id1].innerHTML, v2 = candies[id2].innerHTML;
            candies[id1].innerHTML = v2; candies[id2].innerHTML = v1;
            let match = false;
            for(let i=0; i<64; i++) {
                if(i%8<6 && candies[i].innerHTML === candies[i+1].innerHTML && candies[i].innerHTML === candies[i+2].innerHTML) match = true;
                if(i<48 && candies[i].innerHTML === candies[i+8].innerHTML && candies[i].innerHTML === candies[i+16].innerHTML) match = true;
            }
            candies[id1].innerHTML = v1; candies[id2].innerHTML = v2;
            return match;
        }

        // Game Engine
        function startLevel(lvl) {
            currentLvl = lvl; targetFruit = candyTypes[Math.floor(Math.random() * candyTypes.length)];
            targetCount = 15 + (lvl * 5); initialTarget = targetCount; moves = 30;
            isGameActive = true;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('level-menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('lvlShow').innerText = "Lvl " + lvl;
            document.getElementById('movesShow').innerText = moves;
            resetStars(); updateUI(); initGrid();
        }

        function initGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = ''; candies = [];
            for(let i=0; i<64; i++) {
                const c = document.createElement('div');
                c.className = 'candy'; c.id = i;
                let fruit;
                do { fruit = candyTypes[Math.floor(Math.random()*candyTypes.length)]; } 
                while (willMatch(i, fruit));
                c.innerHTML = fruit; grid.appendChild(c); candies.push(c);
            }
            setupTouch();
        }

        function willMatch(i, fruit) {
            if (i % 8 >= 2 && candies[i-1].innerHTML === fruit && candies[i-2].innerHTML === fruit) return true;
            if (i >= 16 && candies[i-8].innerHTML === fruit && candies[i-16].innerHTML === fruit) return true;
            return false;
        }

        function setupTouch() {
            let startID;
            candies.forEach(c => {
                c.onpointerdown = (e) => startID = parseInt(e.target.id);
                c.onpointerup = (e) => {
                    let target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.className.includes('candy')) swap(startID, parseInt(target.id));
                };
            });
        }

        function swap(id1, id2) {
            if(!isGameActive) return;
            let adj = [id1-1, id1+1, id1-8, id1+8];
            if (adj.includes(id2)) {
                let v1 = candies[id1].innerHTML, v2 = candies[id2].innerHTML;
                candies[id1].innerHTML = v2; candies[id2].innerHTML = v1;
                if (processMatches()) { moves--; document.getElementById('movesShow').innerText = moves; playMatchSound(); } 
                else { setTimeout(() => { candies[id1].innerHTML = v1; candies[id2].innerHTML = v2; }, 200); }
            }
        }

        function processMatches() {
            let found = false, toClear = new Set();
            for(let i=0; i<64; i++) {
                if(i%8<6 && candies[i].innerHTML === candies[i+1].innerHTML && candies[i].innerHTML === candies[i+2].innerHTML) {
                    toClear.add(i); toClear.add(i+1); toClear.add(i+2); found = true;
                }
                if(i<48 && candies[i].innerHTML === candies[i+8].innerHTML && candies[i].innerHTML === candies[i+16].innerHTML) {
                    toClear.add(i); toClear.add(i+8); toClear.add(i+16); found = true;
                }
            }
            toClear.forEach(idx => {
                if(candies[idx].innerHTML === targetFruit && targetCount > 0) { targetCount--; updateUI(); }
                candies[idx].innerHTML = '';
            });
            return found;
        }

        setInterval(() => {
            if(!isGameActive) return;
            processMatches();
            for(let i=55; i>=0; i--) {
                if(candies[i].innerHTML !== '' && candies[i+8].innerHTML === '') {
                    candies[i+8].innerHTML = candies[i].innerHTML; candies[i].innerHTML = '';
                }
            }
            for(let i=0; i<64; i++) if(candies[i].innerHTML === '') candies[i].innerHTML = candyTypes[Math.floor(Math.random()*candyTypes.length)];
            
            if(targetCount <= 0) {
                if(currentLvl == unlockedLevel) { unlockedLevel++; localStorage.setItem('fb_unlocked', unlockedLevel); }
                alert("LEVEL COMPLETE!"); backToMenu();
            } else if(moves <= 0) { alert("GAME OVER!"); backToMenu(); }
        }, 300);

        function updateUI() {
            document.getElementById('targetShow').innerText = `${targetFruit} x ${initialTarget}`;
            document.getElementById('leftShow').innerText = targetCount;
            let percent = ((initialTarget - targetCount) / initialTarget) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            if(percent >= 33) document.getElementById('star1').classList.add('active');
            if(percent >= 66) document.getElementById('star2').classList.add('active');
            if(percent >= 100) document.getElementById('star3').classList.add('active');
        }

        function resetStars() {
            document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
            document.getElementById('progress-fill').style.width = '0%';
        }

        function showLevelMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('level-menu').style.display = 'flex';
            const container = document.getElementById('levelContainer'); container.innerHTML = '';
            for(let i=1; i<=20; i++) {
                const b = document.createElement('div'); b.innerText = i;
                b.className = 'level-node' + (i > unlockedLevel ? ' locked' : '');
                if(i <= unlockedLevel) b.onclick = () => startLevel(i);
                container.appendChild(b);
            }
        }

        function hideLevelMenu() { document.getElementById('level-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }
        function backToMenu() { isGameActive = false; document.getElementById('game-ui').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }
    </script>
</body>
</html>
