<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone | Tasu Baba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #dadbd3; }
        .whatsapp-green { background-color: #00a884; }
        .chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <div class="flex h-full w-full">
        <div class="w-1/3 border-r border-gray-300 bg-white flex flex-col">
            <div class="h-16 bg-[#f0f2f5] flex items-center justify-between px-4">
                <div class="w-10 h-10 bg-gray-300 rounded-full overflow-hidden">
                    <img src="https://via.placeholder.com/40" alt="Profile">
                </div>
                <div class="flex space-gap-4 text-gray-600 text-xl">
                    <i class="fas fa-circle-notch p-2 cursor-pointer"></i>
                    <i class="fas fa-comment-alt p-2 cursor-pointer"></i>
                    <i class="fas fa-ellipsis-v p-2 cursor-pointer"></i>
                </div>
            </div>

            <div class="p-2 bg-white">
                <div class="bg-[#f0f2f5] flex items-center px-3 py-1 rounded-lg">
                    <i class="fas fa-search text-gray-500 text-sm"></i>
                    <input type="text" placeholder="Search or start new chat" class="bg-transparent border-none focus:outline-none ml-4 w-full text-sm py-1">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto">
                <div class="flex items-center p-3 hover:bg-[#f5f6f6] cursor-pointer border-b border-gray-100">
                    <div class="w-12 h-12 bg-blue-500 rounded-full mr-3"></div>
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h2 class="font-semibold text-gray-800">Support Group</h2>
                            <span class="text-xs text-gray-500">12:45 PM</span>
                        </div>
                        <p class="text-sm text-gray-500 truncate">Project kab tak ready hoga?</p>
                    </div>
                </div>
                </div>
        </div>

        <div class="w-2/3 flex flex-col bg-[#efeae2]">
            <div class="h-16 bg-[#f0f2f5] flex items-center px-4 border-l border-gray-300">
                <div class="w-10 h-10 bg-blue-500 rounded-full mr-3"></div>
                <div class="flex-1">
                    <h2 class="font-semibold text-gray-800">Support Group</h2>
                    <p class="text-xs text-gray-500">online</p>
                </div>
                <div class="flex space-gap-4 text-gray-600 text-xl">
                    <i class="fas fa-search p-2 cursor-pointer"></i>
                    <i class="fas fa-ellipsis-v p-2 cursor-pointer"></i>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-10 chat-bg">
                <div class="bg-white p-2 rounded-lg shadow mb-2 max-w-xs">
                    <p class="text-sm">Assalam-o-Alaikum! Kia haal hai?</p>
                    <span class="text-[10px] text-gray-500 float-right">12:40 PM</span>
                </div>
                <div class="bg-[#dcf8c6] p-2 rounded-lg shadow mb-2 max-w-xs ml-auto">
                    <p class="text-sm">Walaikum Assalam, sab theek. Code tayyar hai!</p>
                    <span class="text-[10px] text-gray-500 float-right">12:42 PM</span>
                </div>
            </div>

            <div class="h-16 bg-[#f0f2f5] flex items-center px-4">
                <i class="far fa-smile text-2xl text-gray-600 mr-4 cursor-pointer"></i>
                <i class="fas fa-paperclip text-xl text-gray-600 mr-4 cursor-pointer"></i>
                <input type="text" placeholder="Type a message" class="flex-1 py-2 px-4 rounded-lg focus:outline-none">
                <i class="fas fa-microphone text-2xl text-gray-600 ml-4 cursor-pointer"></i>
            </div>
        </div>
    </div>

</body>
</html>
